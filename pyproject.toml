[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tapestries"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["flask", "pywebview", "numpy"]

[project.scripts]
tapestries = "launch:main"

[tool.setuptools]
py-modules = ["launch", "app", "db", "recall", "montecarlo", "plain", "seed_data"]